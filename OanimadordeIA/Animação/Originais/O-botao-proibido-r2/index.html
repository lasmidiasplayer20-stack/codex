<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>The Forbidden Button — R2</title><style>body{margin:0;background:#071222;color:#d9f7ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(96vw,1280px)}canvas{width:100%;display:block;background:#081323;border-radius:8px}nav{display:flex;gap:14px;padding:16px 0;align-items:center}button{background:#ffd46a;color:#18243c;border:0;border-radius:8px;padding:10px 18px;font-weight:700}input{flex:1;accent-color:#50e5d1}a{color:#50e5d1}</style><main><canvas id="film" width="1920" height="1080" aria-label="The Forbidden Button"></canvas><nav><button id="play">Play</button><input id="seek" aria-label="Seek" type="range" min="0" max="210" step="0.01" value="0"><output id="time">0:00 / 3:30</output></nav><audio id="audio" src="audio/trilha-original.m4a" preload="auto"></audio></main><script src="src/math.js"></script><script src="src/model.js"></script><script src="src/rig-adapter.js"></script><script src="src/story.js"></script><script src="src/performance.js"></script><script src="vendor/rig-controller.js"></script><script src="src/legacy-renderer.js"></script><script src="src/world.js"></script><script>let playing=false,t=0,base=0;const play=document.querySelector('#play'),seek=document.querySelector('#seek'),audio=document.querySelector('#audio');function tick(now){if(!playing)return;t=Math.min(210,(now-base)/1000);film.draw(t);seek.value=t;document.querySelector('#time').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} / 3:30`;if(t<210)requestAnimationFrame(tick);else{playing=false;play.textContent='Play';audio.pause()}}play.onclick=async()=>{playing=!playing;play.textContent=playing?'Pause':'Play';if(playing){if(t>=210)t=0;base=performance.now()-t*1000;audio.currentTime=t;try{await audio.play()}catch{}requestAnimationFrame(tick)}else audio.pause()};seek.oninput=()=>{t=+seek.value;base=performance.now()-t*1000;audio.currentTime=t;film.draw(t)};film.draw(0);</script></html>
