<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Don't Press Play</title><style>body{margin:0;background:#10253a;color:#fff;font:16px system-ui}main{max-width:1280px;margin:auto;padding:20px}canvas{width:100%;background:#f8e9d5;border-radius:14px}button{background:#ffc654;border:0;padding:12px 24px;border-radius:20px;font-weight:700}input{width:65%}h1{font-size:22px}p{color:#b9dce0}</style><main><h1>DON'T PRESS PLAY</h1><canvas id="film" width="1920" height="1080"></canvas><p><button id="play">Play</button> <input id="seek" type="range" min="0" max="210" step="0.001" value="0"> <output id="time">0:00 / 3:30</output></p><audio id="audio" src="audio/master.m4a" preload="metadata"></audio><p>One button. Three friends. Far too many presents.</p></main><script src="src/math.js"></script><script src="src/physics.js"></script><script src="src/story.js"></script><script src="src/model.js"></script><script src="src/performance.js"></script><script src="vendor/rig-controller.js"></script><script src="src/legacy-renderer.js"></script><script src="src/parcels.js"></script><script src="src/world.js"></script><script>let playing=false,origin=0;const seek=document.querySelector('#seek'),play=document.querySelector('#play'),a=document.querySelector('#audio');play.onclick=async()=>{playing=!playing;play.textContent=playing?'Pause':'Play';origin=performance.now()/1000-Number(seek.value);if(playing){a.currentTime=Number(seek.value);await a.play().catch(()=>{});requestAnimationFrame(tick)}else a.pause()};seek.oninput=()=>{const t=Number(seek.value);film.draw(t);origin=performance.now()/1000-t;a.currentTime=t};function tick(){if(!playing)return;const t=Math.min(210,performance.now()/1000-origin);seek.value=t;document.querySelector('#time').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} / 3:30`;film.draw(t);if(t<210)requestAnimationFrame(tick);else{playing=false;play.textContent='Play';a.pause()}}film.draw(0)</script></html>
