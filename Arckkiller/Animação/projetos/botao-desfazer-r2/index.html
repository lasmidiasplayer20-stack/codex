<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>One More Take — Revision 2</title><style>body{margin:0;background:#14233b;color:#fff;font:16px system-ui}main{max-width:1280px;margin:auto;padding:20px}canvas{width:100%;border-radius:18px;background:#ffe9cb}button{background:#ffcc55;border:0;padding:12px 22px;border-radius:20px;font-weight:700}input{width:65%}h1{font-size:22px}p{color:#c1d5e9}</style><main><h1>ONE MORE TAKE · Revision 2</h1><canvas id="film" width="1920" height="1080"></canvas><p><button id="play">Play</button> <input id="seek" type="range" min="0" max="210" step="0.001" value="0"> <output id="time">0:00 / 3:30</output></p><audio id="audio" src="audio/master.m4a" preload="metadata"></audio><p>An original animated short. Amber, Cyan & Ink. A birthday cake. Five second chances.</p></main><script src="src/math.js"></script><script src="src/physics.js"></script><script src="src/story.js"></script><script src="src/model.js"></script><script src="src/performance.js"></script><script src="vendor/rig-controller.js"></script><script src="src/legacy-renderer.js"></script><script src="src/world.js"></script><script>let playing=false,origin=0;const readyAudio=async()=>{if(document.querySelector('#audio').readyState<1)await new Promise(resolve=>document.querySelector('#audio').addEventListener('loadedmetadata',resolve,{once:true}))};const seek=document.querySelector('#seek'),play=document.querySelector('#play'),a=document.querySelector('#audio');play.onclick=async()=>{playing=!playing;play.textContent=playing?'Pause':'Play';origin=performance.now()/1000-Number(seek.value);if(playing){await readyAudio();a.currentTime=Number(seek.value);a.play().catch(()=>{});requestAnimationFrame(tick)}else a.pause()};seek.oninput=async()=>{const target=Number(seek.value);film.draw(Number(seek.value));origin=performance.now()/1000-Number(seek.value);await readyAudio();a.currentTime=target};function tick(){if(!playing)re
